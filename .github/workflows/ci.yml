name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject tracked environment files
        run: |
          tracked_files="$(git ls-files -- '.env' 'devlog-server/.env' 'devlog-client/.env')"
          if [ -n "$tracked_files" ]; then
            echo "Environment files must not be committed:"
            echo "$tracked_files"
            exit 1
          fi

  frontend-build:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devlog-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: devlog-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend-tests:
    name: Backend tests in Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devlog-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: devlog-server/package-lock.json
      - name: Validate Compose configuration
        run: docker compose -f ../docker-compose.yml --profile test config --quiet
      - name: Run backend tests in Docker
        run: npm run docker:test
      - run: npm audit --omit=dev --audit-level=high

  end-to-end:
    name: End-to-end flow
    runs-on: ubuntu-latest
    needs: [repository-safety, frontend-build, backend-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: devlog-server/package-lock.json
      - name: Validate Compose configuration
        run: docker compose --profile e2e config --quiet
      - name: Run Playwright in Docker
        working-directory: devlog-server
        run: npm run docker:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: devlog-client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean Docker resources
        if: always()
        run: docker compose --profile e2e down --volumes --remove-orphans
